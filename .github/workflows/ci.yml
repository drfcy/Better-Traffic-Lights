name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build release app
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-app.sh
      - name: Verify architecture
        run: lipo "build/Better Traffic Lights.app/Contents/MacOS/TrafficLightsPlus" -verify_arch "${{ matrix.arch }}"
      - name: Verify signature
        run: codesign --verify --deep --strict "build/Better Traffic Lights.app"

  sanitizers:
    name: ${{ matrix.sanitizer }} Sanitizer
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test --sanitize=${{ matrix.sanitizer }}
